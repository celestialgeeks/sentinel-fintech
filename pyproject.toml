[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "N", "PLC", "PLE", "PLR", "PLW", "W", "B", "UP"]
ignore = ["PLR2004", "PLW0603"]

[tool.ruff.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.coverage.run]
source = ["src"]
omit = ["src/scripts/migrate.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
