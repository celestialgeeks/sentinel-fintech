[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=40"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "PLC", "PLE", "PLR", "PLW", "W", "B", "UP"]
ignore = ["PLR2004", "PLW0603"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLR0913", "PLR0917"]
# FastAPI routers: ``Depends()`` in a default argument is the framework idiom, and
# an endpoint takes one keyword per documented query parameter.
"**/router.py" = ["B008", "PLR0913", "PLR0917", "PLR0912"]
# The shared ``Depends`` providers are the same framework idiom as a router's.
"src/api/dependencies.py" = ["B008"]
# The portal read layer is SQL-shaped: one keyword per ledger filter, and aggregate
# functions branch on the window and verdict mix they were asked for.
"src/portal/**" = ["B008", "PLR0913", "PLR0917", "PLR0912"]
# Seed helpers take one keyword per scenario knob; migrations are long straight-line
# DDL scripts where branch counts are a property of the schema, not the logic.
"src/scripts/*" = ["PLR0913"]
"alembic/versions/*" = ["PLR0912", "PLR0913"]
# The dev server must set DATABASE_URL before importing src.core.db (which
# builds its engine at import time), so its imports are deliberately deferred.
"src/scripts/dev_server.py" = ["PLC0415"]

[tool.coverage.run]
source = ["src"]
omit = ["src/scripts/migrate.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
