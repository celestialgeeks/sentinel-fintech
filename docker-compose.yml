version: "3.9"

services:
  # ─── API Gateway ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sentinel:sentinel_pass@postgres:5432/sentinel
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_URI=http://milvus:19530
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - KAFKA_SCHEMAREGISTRY=http://schema-registry:8081
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
      kafka:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - sentinel-net

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=sentinel_pass
      - POSTGRES_DB=sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sentinel-net

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass sentinel_redis_pass
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sentinel_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sentinel-net

  # ─── Milvus (Vector Database) ──────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: sentinel-etcd
    environment:
      - ETCDCTL_API=3
      - ETCD_AUTO_COMPACTION_RETENTION=1
    volumes:
      - etcd_data:/etcd
    networks:
      - sentinel-net
    command: >
      /usr/local/bin/etcd
      --data-dir=/etcd
      --log-level=info
      --listen-client-urls=http://0.0.0.0:2379
      --advertise-client-urls=http://etcd:2379
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-advertise-peer-urls=http://etcd:2380
      --initial-cluster=etcd=http://etcd:2380

  minio:
    image: minio/minio:latest
    container_name: sentinel-minio
    command: server /minio_data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/minio_data
    networks:
      - sentinel-net
    depends_on:
      - etcd

  milvus:
    image: milvusdb/milvus:v2.4.9
    container_name: sentinel-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MQ_TYPE=embedded
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - sentinel-net
    depends_on:
      - etcd
      - minio

  # ─── Kafka ─────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: sentinel-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
    networks:
      - sentinel-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sentinel-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    networks:
      - sentinel-net
    depends_on:
      - zookeeper

  # ─── Monitoring ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - sentinel-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - sentinel-net
    depends_on:
      - prometheus

# ─── Volumes ─────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  prometheus_data:
  grafana_data:

# ─── Networks ────────────────────────────────────────────────
networks:
  sentinel-net:
    driver: bridge
