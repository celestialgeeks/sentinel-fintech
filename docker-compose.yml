version: "3.9"

services:
  # ─── API Gateway ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-api
    ports:
      - "8000:8000"
    environment:
      # Postgres and Auth are Supabase's, so these come from the host .env rather
      # than from containers below. DATABASE_URL must be the session-mode pooler
      # URL (…pooler.supabase.com:5432, user postgres.<ref>): the direct
      # db.<ref>.supabase.co endpoint is IPv6-only and a container such as Render
      # or this one cannot reach it.
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env to the Supabase pooler URL}
      - SUPABASE_URL=${SUPABASE_URL:?set SUPABASE_URL in .env}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in .env}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER:-}
      - SUPABASE_JWT_AUDIENCE=${SUPABASE_JWT_AUDIENCE:-authenticated}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-5}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-5}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-sentinel_redis_pass}@redis:6379/0
      - MILVUS_URI=http://milvus:19530
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - KAFKA_SCHEMA_REGISTRY=http://schema-registry:8081
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-sentinel_neo4j_pass}
      - ENVIRONMENT=development
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
      kafka:
        condition: service_started
      neo4j:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - sentinel-net

  # PostgreSQL is not in this file any more: the schema lives in Supabase and is
  # created by `python -m src.scripts.migrate upgrade head`. A second Postgres
  # container here would be a second source of truth for the schema, which is how
  # the migration history drifted from the models in the first place.

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-sentinel_redis_pass}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sentinel_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sentinel-net

  # ─── Milvus (Vector Database) ──────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: sentinel-etcd
    environment:
      - ETCDCTL_API=3
      - ETCD_AUTO_COMPACTION_RETENTION=1
    volumes:
      - etcd_data:/etcd
    networks:
      - sentinel-net
    command: >
      /usr/local/bin/etcd
      --data-dir=/etcd
      --log-level=info
      --listen-client-urls=http://0.0.0.0:2379
      --advertise-client-urls=http://etcd:2379
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-advertise-peer-urls=http://etcd:2380
      --initial-cluster=etcd=http://etcd:2380

  minio:
    image: minio/minio:latest
    container_name: sentinel-minio
    command: server /minio_data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/minio_data
    networks:
      - sentinel-net
    depends_on:
      - etcd

  milvus:
    image: milvusdb/milvus:v2.4.9
    container_name: sentinel-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MQ_TYPE=embedded
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - sentinel-net
    depends_on:
      - etcd
      - minio

  # ─── Neo4j (Graph Database) ────────────────────────────────
  neo4j:
    image: neo4j:5.22.0
    container_name: sentinel-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-sentinel_neo4j_pass}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - ./config/neo4j.conf:/var/lib/neo4j/conf/neo4j.conf
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-sentinel_neo4j_pass} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sentinel-net

  # ─── Kafka ─────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: sentinel-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
    networks:
      - sentinel-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sentinel-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    networks:
      - sentinel-net
    depends_on:
      - zookeeper

  # ─── Monitoring ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - sentinel-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - sentinel-net
    depends_on:
      - prometheus

# ─── Volumes ─────────────────────────────────────────────────
volumes:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  prometheus_data:
  grafana_data:

# ─── Networks ────────────────────────────────────────────────
networks:
  sentinel-net:
    driver: bridge
